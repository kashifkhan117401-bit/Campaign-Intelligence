services:
  db:
    image: postgres:16-alpine
    container_name: tubemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tubemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tubemind_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tubemind}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tubemind} -d ${POSTGRES_DB:-tubemind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tubemind-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tubemind}:${POSTGRES_PASSWORD:-tubemind_secret_pass}@db:5432/${POSTGRES_DB:-tubemind}
      UPLOAD_DIR: /app/storage/uploads
      REPORTS_DIR: /app/storage/reports
      FRAMES_DIR: /app/storage/frames
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    container_name: tubemind-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_storage:
